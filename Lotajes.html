<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Dual | Doberwhite Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #12141c;
      --card-border: #1f2430;
      --accent-gold: #e5a93b;
      --accent-gold-hover: #f5b94c;
      --text-main: #f0f2f5;
      --text-muted: #8a94a6;
      --input-bg: #1a1d28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent-gold);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Estilos de Sección */
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* Panel Cuenta Modelo */
    .model-account-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    input[type="number"] {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s ease;
      width: 140px;
    }

    input[type="number"]:focus {
      border-color: var(--accent-gold);
    }

    .static-badge {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 1.1rem;
    }

    .model-result {
      text-align: right;
    }

    .model-result .lot-val {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Panel Cuenta 10k */
    .panel-10k {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .controls-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .preset-buttons {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-preset {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-preset:hover, .btn-preset.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    /* Grid de tarjetas 10k */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .asset-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      transition: border-color 0.2s ease;
    }

    .asset-card:hover {
      border-color: rgba(229, 169, 59, 0.4);
    }

    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .asset-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .asset-type {
      font-size: 0.7rem;
      background: rgba(229, 169, 59, 0.1);
      color: var(--accent-gold);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .lot-display {
      text-align: center;
      margin-top: 8px;
    }

    .lot-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .lot-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin: 4px 0;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>DOBER<span>WHITE</span> TRADING</h1>
      <p>Calculadora de Ejecución Simultánea</p>
    </header>

    <!-- SECCIÓN 1: CUENTA MODELO $500 -->
    <div class="section-title">1. Cuenta Modelo ($500)</div>
    <div class="model-account-panel">
      <div class="input-group">
        <label>Activo</label>
        <div class="static-badge">USDCAD</div>
      </div>

      <div class="input-group">
        <label>Riesgo Fijo</label>
        <div class="static-badge">$5 USD</div>
      </div>

      <div class="input-group">
        <label for="slModel">Stop Loss (Pips)</label>
        <input type="number" id="slModel" value="20" min="0.1" step="any" oninput="calcModelAccount()">
      </div>

      <div class="model-result">
        <div class="lot-label">Lotaje Recomendado</div>
        <div class="lot-val" id="lotModel">0.03</div>
      </div>
    </div>

    <!-- SECCIÓN 2: CUENTA $10K -->
    <div class="section-title">2. Cuenta Principal ($10K)</div>
    <div class="panel-10k">
      
      <div class="controls-row">
        <!-- Riesgo Variable -->
        <div class="input-group">
          <label for="risk10k">Riesgo en USD</label>
          <div class="input-wrapper">
            <span style="left:10px;">$</span>
            <input type="number" id="risk10k" value="30" min="1" step="any" style="padding-left:26px;" oninput="calc10kAccount()">
          </div>
          <div class="preset-buttons">
            <button class="btn-preset active" onclick="setRisk10k(30, this)">$30</button>
            <button class="btn-preset" onclick="setRisk10k(40, this)">$40</button>
            <button class="btn-preset" onclick="setRisk10k(50, this)">$50</button>
          </div>
        </div>

        <!-- Stop Loss Global -->
        <div class="input-group">
          <label for="sl10k">Stop Loss (Pips / Puntos)</label>
          <input type="number" id="sl10k" value="20" min="0.1" step="any" style="width:100%;" oninput="calc10kAccount()">
        </div>
      </div>

      <!-- Tarjetas de Activos -->
      <div class="results-grid">
        <!-- USDCAD -->
        <div class="asset-card">
          <div class="asset-header">
            <span class="asset-title">USDCAD</span>
            <span class="asset-type">FOREX</span>
          </div>
          <div class="lot-display">
            <div class="lot-label">Lotaje</div>
            <div class="lot-value" id="lot10kUsdcad">0.00</div>
          </div>
        </div>

        <!-- XAUUSD -->
        <div class="asset-card">
          <div class="asset-header">
            <span class="asset-title">XAUUSD</span>
            <span class="asset-type">ORO</span>
          </div>
          <div class="lot-display">
            <div class="lot-label">Lotaje</div>
            <div class="lot-value" id="lot10kXauusd">0.00</div>
          </div>
        </div>

        <!-- NAS100 -->
        <div class="asset-card">
          <div class="asset-header">
            <span class="asset-title">NAS100</span>
            <span class="asset-type">ÍNDICE</span>
          </div>
          <div class="lot-display">
            <div class="lot-label">Lotaje</div>
            <div class="lot-value" id="lot10kNas100">0.00</div>
          </div>
        </div>
      </div>

    </div>

    <footer>
      Doberwhite Style Interface &bull; Diseñado para ejecuciones rápidas
    </footer>
  </div>

  <script>
    const PIP_USDCAD = 7.40;
    const PIP_XAUUSD = 10.0;
    const POINT_NAS100 = 1.0;

    // Cálculo Cuenta Modelo ($500)
    function calcModelAccount() {
      const sl = parseFloat(document.getElementById('slModel').value) || 0;
      if (sl <= 0) {
        document.getElementById('lotModel').innerText = "0.00";
        return;
      }
      const lot = 5 / (sl * PIP_USDCAD);
      document.getElementById('lotModel').innerText = formatLot(lot);
    }

    // Cálculo Cuenta $10k
    function calc10kAccount() {
      const risk = parseFloat(document.getElementById('risk10k').value) || 0;
      const sl = parseFloat(document.getElementById('sl10k').value) || 0;

      if (risk <= 0 || sl <= 0) {
        document.getElementById('lot10kUsdcad').innerText = "0.00";
        document.getElementById('lot10kXauusd').innerText = "0.00";
        document.getElementById('lot10kNas100').innerText = "0.00";
        return;
      }

      const lotUsdcad = risk / (sl * PIP_USDCAD);
      const lotXauusd = risk / (sl * PIP_XAUUSD);
      const lotNas100 = risk / (sl * POINT_NAS100);

      document.getElementById('lot10kUsdcad').innerText = formatLot(lotUsdcad);
      document.getElementById('lot10kXauusd').innerText = formatLot(lotXauusd);
      document.getElementById('lot10kNas100').innerText = formatLot(lotNas100);
    }

    // Botones rápidos de selección $30, $40, $50
    function setRisk10k(val, btn) {
      document.getElementById('risk10k').value = val;
      
      const buttons = document.querySelectorAll('.preset-buttons .btn-preset');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      calc10kAccount();
    }

    function formatLot(val) {
      if (val < 0.01) return "0.01";
      return val.toFixed(2);
    }

    // Inicializar cálculos
    calcModelAccount();
    calc10kAccount();
  </script>
</body>
</html>
