name: Actualizar monitor

on:
  schedule:
    # cada 30 min de lunes a viernes (hora UTC; cubre Asia, Europa y América)
    - cron: "7,37 * * * 1-5"
    # domingo en la tarde de Chile, para la apertura de Asia
    - cron: "7,37 21-23 * * 0"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recargar también las fuentes mensuales (OCDE, FMI, BIS, FRED, Chile)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar, calcular y cifrar
        env:
          MESA_CLAVE: ${{ secrets.MESA_CLAVE }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FORZAR_TODO: ${{ inputs.forzar && '1' || '0' }}
        run: python monitor_actualizar.py
      - name: Publicar (un solo commit, sin acumular historial)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add monitor_datos.json cache_ultimo.json.enc
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit --amend -m "Datos del monitor $(date -u +%Y-%m-%dT%H:%MZ)" || git commit -m "Datos del monitor"
          git push --force
